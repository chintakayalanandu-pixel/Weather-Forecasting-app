<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; font-weight: 600; }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box input {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            outline: none;
            width: 220px;
            font-size: 14px;
        }
        .search-box button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #ff9800;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover { background: #e68900; }
        .search-box button.locate { background: #4caf50; }
        .search-box button.locate:hover { background: #3d8b40; }

        #historyContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .history-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .history-chip:hover { background: rgba(255,255,255,0.25); }

        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .main-card .left h2 { font-size: 28px; margin-bottom: 5px; }
        .main-card .left p { opacity: 0.8; font-size: 14px; }
        .main-card .temp { font-size: 64px; font-weight: 700; }
        .main-card img { width: 80px; height: 80px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .label { font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
        .stat-card .value { font-size: 20px; font-weight: 600; }

        .section-title { font-size: 18px; margin-bottom: 15px; font-weight: 600; }

        .hourly-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }
        .hourly-card {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
            min-width: 90px;
        }
        .hourly-card .time { font-size: 12px; opacity: 0.8; margin-bottom: 6px; }
        .hourly-card img { width: 40px; height: 40px; }
        .hourly-card .htemp { font-size: 16px; font-weight: 600; margin-top: 4px; }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .forecast-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .forecast-card .day { font-size: 13px; opacity: 0.8; margin-bottom: 8px; }
        .forecast-card img { width: 50px; height: 50px; }
        .forecast-card .ftemp { font-size: 18px; font-weight: 600; margin-top: 5px; }

        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        #errorMsg { color: #ff5252; text-align: center; margin: 10px 0; font-weight: 600; }

        @media (max-width: 600px) {
            .main-card .temp { font-size: 48px; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌤️ Weather Dashboard</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="City Name (e.g., Kadapa)" onkeydown="if(event.key==='Enter') fetchWeather()">
            <button onclick="fetchWeather()">Search</button>
            <button class="locate" onclick="detectLocation()">📍My Location</button>
        </div>
    </div>

    <div id="historyContainer"></div>
    <div id="errorMsg"></div>

    <div id="dashboard" style="display:none;">
        <div class="main-card">
            <div class="left">
                <h2 id="cityName">—</h2>
                <p id="description">—</p>
            </div>
            <div style="display:flex; align-items:center; gap:20px;">
                <img id="weatherIcon" src="" alt="icon">
                <div class="temp" id="mainTemp">—°C</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="label">Feels Like</div><div class="value" id="feelsLike">—</div></div>
            <div class="stat-card"><div class="label">Humidity</div><div class="value" id="humidity">—</div></div>
            <div class="stat-card"><div class="label">Wind Speed</div><div class="value" id="windSpeed">—</div></div>
            <div class="stat-card"><div class="label">Pressure</div><div class="value" id="pressure">—</div></div>
        </div>

        <div class="section-title">Hourly Forecast (Next 24 Hours)</div>
        <div class="hourly-grid" id="hourlyCards"></div>

        <div class="section-title">5-Day Forecast</div>
        <div class="forecast-grid" id="forecastCards"></div>

        <div class="chart-container">
            <canvas id="forecastChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function saveSearchHistory(cityName) {
            let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
            const exists = history.some(c => c.toLowerCase() === cityName.toLowerCase());
            if (!exists) {
                history.push(cityName);
                localStorage.setItem('searchHistory', JSON.stringify(history));
            }
        }

        function renderSearchHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('searchHistory')) || [];
            history.forEach(city => {
                const btn = document.createElement('button');
                btn.className = 'history-chip';
                btn.textContent = city;
                btn.onclick = () => {
                    document.getElementById('cityInput').value = city;
                    fetchWeather();
                };
                container.appendChild(btn);
            });
        }

        function detectLocation() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = 'Getting your location...';

            if (!navigator.geolocation) {
                errorMsg.textContent = 'Your browser does not support geolocation';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    fetchWeather(latitude, longitude);
                },
                (error) => {
                    errorMsg.textContent = 'Could not get location: ' + error.message;
                }
            );
        }

        async function fetchWeather(lat = null, lon = null) {
            const cityInput = document.getElementById('cityInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            let weatherUrl, forecastUrl, hourlyUrl;
            if (lat && lon) {
                weatherUrl = `/api/weather?lat=${lat}&lon=${lon}`;
                forecastUrl = `/api/forecast?lat=${lat}&lon=${lon}`;
                hourlyUrl = `/api/hourly?lat=${lat}&lon=${lon}`;
            } else if (cityInput) {
                weatherUrl = `/api/weather?city=${encodeURIComponent(cityInput)}`;
                forecastUrl = `/api/forecast?city=${encodeURIComponent(cityInput)}`;
                hourlyUrl = `/api/hourly?city=${encodeURIComponent(cityInput)}`;
            } else {
                errorMsg.textContent = 'Please enter a city or click 📍';
                return;
            }

            const res = await fetch(weatherUrl);
            const data = await res.json();

            if (data.error) {
                errorMsg.textContent = data.error;
                document.getElementById('dashboard').style.display = 'none';
                return;
            }

            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('cityName').textContent = data.city;
            document.getElementById('description').textContent = data.description;
            document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
            document.getElementById('mainTemp').textContent = `${Math.round(data.temp)}°C`;
            document.getElementById('feelsLike').textContent = `${Math.round(data.feels_like)}°C`;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind_speed} m/s`;
            document.getElementById('pressure').textContent = `${data.pressure} hPa`;

            if (!lat && cityInput) {
                saveSearchHistory(data.city);
            }
            renderSearchHistory();

            const hres = await fetch(hourlyUrl);
            const hdata = await hres.json();
            if (!hdata.error) {
                const hourlyDiv = document.getElementById('hourlyCards');
                hourlyDiv.innerHTML = '';
                hdata.forEach(item => {
                    const d = new Date(item.time);
                    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });
                    hourlyDiv.innerHTML += `
                        <div class="hourly-card">
                            <div class="time">${timeStr}</div>
                            <img src="https://openweathermap.org/img/wn/${item.icon}@2x.png" alt="icon">
                            <div class="htemp">${Math.round(item.temp)}°C</div>
                        </div>
                    `;
                });
            }

            const fres = await fetch(forecastUrl);
            const fdata = await fres.json();
            if (fdata.error) return;

            const cardsDiv = document.getElementById('forecastCards');
            cardsDiv.innerHTML = '';
            fdata.forEach(item => {
                const date = new Date(item.time);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                cardsDiv.innerHTML += `
                    <div class="forecast-card">
                        <div class="day">${dayName}</div>
                        <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="icon">
                        <div class="ftemp">${Math.round(item.temp)}°C</div>
                    </div>
                `;
            });

            const labels = fdata.map(item => {
                const d = new Date(item.time);
                return d.toLocaleDateString('en-US', { weekday: 'short' });
            });
            const temps = fdata.map(item => item.temp);

            if (myChart) myChart.destroy();
            const ctx = document.getElementById('forecastChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: temps,
                        borderColor: '#ff9800',
                        backgroundColor: 'rgba(255, 152, 0, 0.15)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ff9800'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSearchHistory();
        });
    </script>
</body>
</html>
